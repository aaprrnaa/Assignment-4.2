
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <header>
        <h1>Job Application Form</h1>
        <p>Please fill in the details below to apply for a job.</p>
    </header>

    <main>
        <form action="#" method="post">

            <div>
                <label for="fullname">Full Name:</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <br>

            <div>
                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                >
            </div>

            <br>

            <div>
                <label for="dob">Date of Birth:</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >
            </div>

            <br>

            <div>
                <label for="portfolio">Portfolio URL:</label>
                <input
                    type="url"
                    id="portfolio"
                    name="portfolio"
                    placeholder="https://example.com"
                >
            </div>

            <br>

            <fieldset>
                <legend>Preferred Shift:</legend>

                <input
                    type="radio"
                    id="morning"
                    name="shift"
                    value="morning"
                    required
                >
                <label for="morning">Morning</label>

                <input
                    type="radio"
                    id="evening"
                    name="shift"
                    value="evening"
                >
                <label for="evening">Evening</label>

                <input
                    type="radio"
                    id="night"
                    name="shift"
                    value="night"
                >
                <label for="night">Night</label>
            </fieldset>

            <br>

            <fieldset>
                <legend>Technical Skills:</legend>

                <input
                    type="checkbox"
                    id="html"
                    name="skills"
                    value="HTML"
                >
                <label for="html">HTML</label>

                <input
                    type="checkbox"
                    id="css"
                    name="skills"
                    value="CSS"
                >
                <label for="css">CSS</label>

                <input
                    type="checkbox"
                    id="javascript"
                    name="skills"
                    value="JavaScript"
                >
                <label for="javascript">JavaScript</label>

                <input
                    type="checkbox"
                    id="java"
                    name="skills"
                    value="Java"
                >
                <label for="java">Java</label>
            </fieldset>

            <br>

            <div>
                <label for="qualification">Highest Qualification:</label>
                <select
                    id="qualification"
                    name="qualification"
                    required
                >
                    <option value="">Select Qualification</option>
                    <option value="school">School</option>
                    <option value="diploma">Diploma</option>
                    <option value="bachelor">Bachelor's Degree</option>
                    <option value="master">Master's Degree</option>
                </select>
            </div>

            <br>

            <div>
                <label for="coverletter">Cover Letter:</label>
                <textarea
                    id="coverletter"
                    name="coverletter"
                    rows="5"
                    cols="40"
                    placeholder="Write your cover letter here..."
                    required
                ></textarea>
            </div>

            <br>

            <div>
                <label for="applicationid">Application ID:</label>
                <input
                    type="text"
                    id="applicationid"
                    name="applicationid"
                    value="Assigned by HR"
                    disabled
                >
            </div>

            <br>

            <button type="submit">Submit Application</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Job Application Portal</p>
    </footer>

</body>
</html>
